<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>
    // 手机 UA 自动跳转移动版（在下载桌面 bundle 之前执行）。
    //
    // ⚠ 这里必须是**双向**的。原来只有 ?desktop=1 这一个方向：手机上点过一次
    //   移动版页头的「桌面版」链接，标记就永久留下，之后每次打开都是 PC 版，
    //   而桌面版页面上没有任何回移动版的入口 —— 一道有去无回的门（实测反馈）。
    //   现在 ?mobile=1 清掉标记并跳回移动版，桌面版在手机 UA 下也会显示「移动版」链接。
    (function () {
      try {
        if (location.search.indexOf('mobile=1') !== -1) {
          localStorage.removeItem('wt_force_desktop');
          location.replace('/m/');
          return;
        }
        if (location.search.indexOf('desktop=1') !== -1) {
          localStorage.setItem('wt_force_desktop', '1');
        } else if (!localStorage.getItem('wt_force_desktop') &&
                   /Mobi|Android|iPhone|iPod/i.test(navigator.userAgent)) {
          location.replace('/m/');
        }
      } catch (e) { /* localStorage 不可用时放行桌面版 */ }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网梯终端 - WhatyTerm</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/xterm.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
